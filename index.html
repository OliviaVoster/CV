<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Olivia Voster</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-content: center;
    gap: 1.25rem;
    padding: 2rem;
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #fbfaf8;
    color: #1c1a17;
    text-align: center;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #171513; color: #f2efea; }
  }
  h1 { font-size: 1.5rem; margin: 0; letter-spacing: -0.015em; }
  p { margin: 0; color: #5f5a53; }
  @media (prefers-color-scheme: dark) { p { color: #a8a099; } }
  a {
    display: inline-block;
    margin-top: 0.5rem;
    padding: 0.6rem 1.2rem;
    border-radius: 8px;
    border: 1px solid currentColor;
    text-decoration: none;
    color: #8a5a2b;
  }
  @media (prefers-color-scheme: dark) { a { color: #d9a066; } }
</style>
</head>
<body>
  <h1>Olivia Voster</h1>
  <p>A new version of this site is being built.</p>
  <a href="v1/">View the current CV</a>
</body>
</html>
